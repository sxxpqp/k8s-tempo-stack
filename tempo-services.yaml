      protocol: TCP
    - name: metrics
      port: 3200
      targetPort: 3200
      protocol: TCP
    - name: memberlist
      port: 7946
      targetPort: 7946
      protocol: TCP
  selector:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/component: distributor
    app.kubernetes.io/part-of: tempo-stack
