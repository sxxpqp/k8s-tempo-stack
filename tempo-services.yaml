---
# ── memberlist 集群内部发现 ─────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: tempo-memberlist
  namespace: monitoring
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/component: memberlist
    app.kubernetes.io/part-of: tempo-stack
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: 7946
      targetPort: 7946
      protocol: TCP
  selector:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: tempo-stack
---
