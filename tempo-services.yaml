      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: jaeg-thrift
      port: 14268
      targetPort: 14268
      protocol: TCP
    - name: jaeg-compact
      port: 6831
      targetPort: 6831
      protocol: UDP
    - name: jaeg-binary
      port: 6832
      targetPort: 6832
      protocol: UDP
    - name: jaeger-grpc
      port: 14250
      targetPort: 14250
      protocol: TCP
    - name: zipkin
      port: 9411
