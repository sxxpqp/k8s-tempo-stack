apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-service
  namespace: demo
  labels:
    app.kubernetes.io/name: python-service
    app.kubernetes.io/part-of: demo-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: python-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: python-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: python-service
          image: registry.cn-hangzhou.aliyuncs.com/sxxpqp/python-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "tempo-distributor.monitoring:4317"
          envFrom:
            - configMapRef:
                name: demo-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: python-service
  namespace: demo
  labels:
    app.kubernetes.io/name: python-service
    app.kubernetes.io/part-of: demo-stack
spec:
  selector:
    app.kubernetes.io/name: python-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080