apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo
  namespace: demo
  labels:
    app.kubernetes.io/part-of: demo-stack
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: go-service
  namespace: demo
  labels:
    release: kps
    app.kubernetes.io/part-of: demo-stack
spec:
  namespaceSelector:
    matchNames: [demo]
  selector:
    matchLabels:
      app.kubernetes.io/name: go-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: python-service
  namespace: demo
  labels:
    release: kps
    app.kubernetes.io/part-of: demo-stack
spec:
  namespaceSelector:
    matchNames: [demo]
  selector:
    matchLabels:
      app.kubernetes.io/name: python-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: java-service
  namespace: demo
  labels:
    release: kps
    app.kubernetes.io/part-of: demo-stack
spec:
  namespaceSelector:
    matchNames: [demo]
  selector:
    matchLabels:
      app.kubernetes.io/name: java-service
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s