---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tempo-distributor
  namespace: monitoring
  labels:
    release: kps
    app.kubernetes.io/name: tempo
    app.kubernetes.io/component: distributor
    app.kubernetes.io/part-of: tempo-stack
spec:
  namespaceSelector:
    matchNames: [monitoring]
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
      app.kubernetes.io/component: distributor
      app.kubernetes.io/part-of: tempo-stack
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - targetLabel: job
          replacement: tempo-distributor
