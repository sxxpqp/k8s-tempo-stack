---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo-metrics-generator
  namespace: monitoring
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/component: metrics-generator
    app.kubernetes.io/part-of: tempo-stack
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
      app.kubernetes.io/component: metrics-generator
      app.kubernetes.io/part-of: tempo-stack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo
        app.kubernetes.io/component: metrics-generator
        app.kubernetes.io/part-of: tempo-stack
    spec:
      serviceAccountName: tempo
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: tempo
          image: grafana/tempo:2.7.1
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/tempo/tempo.yaml
            - -config.per-user-override-config=/etc/tempo-runtime/runtime-config.yaml
            - -target=metrics-generator
          ports:
            - name: metrics
              containerPort: 3200
              protocol: TCP
            - name: memberlist
              containerPort: 7946
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: 3200
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true
            - name: runtime-config
              mountPath: /etc/tempo-runtime
              readOnly: true
            - name: tmp
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: tempo-config
            defaultMode: 0400
        - name: runtime-config
          configMap:
            name: tempo-runtime-config
            defaultMode: 0400
        - name: tmp
          emptyDir: {}